services:
  demo-backend:
    build: ./backend
    container_name: demo-backend   # log_monitor.py watches this exact name
    ports:
      - "9000:9000"
    env_file: .env
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=9000
    restart: unless-stopped

  demo-frontend:
    build: ./frontend
    container_name: demo-frontend
    ports:
      - "5174:80"
    depends_on:
      - demo-backend
    restart: unless-stopped
